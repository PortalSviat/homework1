<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            background-color: #000000;
            margin: 0;
        }

        .main-container {
            display: flex;
            gap: 12px;
            width: 976px;
            margin: 20px auto;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .flex-row {
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .box {
            background-color: rgb(208, 35, 220);
            border-radius: 12px;
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .box1 {
            width: 220px;
            height: 330px;
        }

        .box2 {
            width: 220px;
            height: 166px;
        }

        .box3 {
            width: 472px;
            height: 200px;
        }

        .box4 {
            width: 240px;
            height: 200px;
        }

        .box5 {
            width: 250px;
            height: 200px;
        }

        .box6 {
            width: 502px;
            height: 296px;
        }

        .box7 {
            width: 250px;
            height: 200px;
        }

        .box8 {
            width: 230px;
            height: 370px;
        }

        .box9 {
            width: 230px;
            height: 338px;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="flex-column">
            <div class="flex-row">
                <div class="flex-column">
                    <div class="box box1"></div>
                    <div class="box box2"></div>
                </div>
                <div class="flex-column">
                    <div class="flex-row">
                        <div class="box box4"></div>
                        <div class="box box5"></div>
                    </div>
                    <div class="box box6">
                    </div>
                </div>
            </div>
            <div class="flex-row">
                <div class="box box3"></div>
                <div class="box box7"></div>
            </div>
        </div>
        <div class="flex-column">
            <div class="box box8"></div>
            <div class="box box9"></div>
        </div>
    </div>
</body>

</html>
